name: Inspect Prototype

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode prototype
        run: |
          curl -L --fail --retry 3 -o apktool.jar             https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar d vendor/EysClone-1.3.59.apk -o decoded -f

      - name: Report manifest entry points
        run: |
          echo '=== MANIFEST ==='
          grep -nE '<manifest |<activity |<activity-alias |MAIN|LAUNCHER' decoded/AndroidManifest.xml | head -80
          echo
          echo '=== FILE TREE (PRIMARY SMALI) ==='
          find decoded -maxdepth 3 -type d -name 'smali*' -print
          echo
          echo '=== RELEVANT STRING REFERENCES ==='
          grep -R -n -E 'Enter license key|Activate your key first|License verified\.|License active|Verify your key again|Get a key on Discord|Contact Eys on Discord|Discord alerts|webhook URL|Get the latest EysClone release|Subscription allowance' decoded/smali* 2>/dev/null | head -300 || true

      - name: Save focused source report
        run: |
          mkdir -p report
          grep -R -n -B12 -A24 -E 'Enter license key|Activate your key first|License verified\.|License active|Verify your key again|Get a key on Discord|Contact Eys on Discord|Discord alerts|webhook URL|Get the latest EysClone release|Subscription allowance' decoded/smali* 2>/dev/null | head -1200 > report/relevant-smali.txt || true
          cp decoded/AndroidManifest.xml report/AndroidManifest.xml
          zip -qr prototype-inspection.zip report

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: prototype-inspection
          path: prototype-inspection.zip
