name: Build FLY8's Light Cloner Private Beta

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: fly8-light-cloner-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'

      - name: Obtain prototype APK
        run: |
          mkdir -p vendor
          if [ ! -s vendor/EysClone-1.3.59.apk ]; then
            curl -L --fail --retry 4               -o vendor/EysClone-1.3.59.apk               https://raw.githubusercontent.com/FL8Y/LiteCloner/main/vendor/EysClone-1.3.59.apk
          fi
          test -s vendor/EysClone-1.3.59.apk

      - name: Build Shizuku bridge
        run: gradle :app:assembleRelease --stacktrace

      - name: Build current ManifestEditor
        run: |
          rm -rf /tmp/ManifestEditor
          git clone --depth 1 https://github.com/WindySha/ManifestEditor.git /tmp/ManifestEditor
          cd /tmp/ManifestEditor
          git checkout ee68565503bffca9fa170ea5a055574d7f60b217
          find lib/src/main/java -name '*.java' -print > /tmp/manifest-sources.txt
          mkdir -p /tmp/manifest-classes
          javac -encoding UTF-8 -source 8 -target 8             -d /tmp/manifest-classes @/tmp/manifest-sources.txt
          cp -R lib/src/main/assets /tmp/manifest-classes/
          cd /home/runner/work/FLY8-s-Light-Cloner/FLY8-s-Light-Cloner
          jar cfe tools/ManifestEditor-current.jar             com.wind.meditor.ManifestEditorMain             -C /tmp/manifest-classes .

      - name: Read prototype package id
        id: package
        run: |
          PKG=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging             vendor/EysClone-1.3.59.apk             | sed -n "s/package: name='\\([^']*\\)'.*/\\1/p"             | head -n 1)
          test -n "$PKG"
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "Prototype package: $PKG"

      - name: Patch binary manifest
        run: |
          mkdir -p dist
          javac -cp tools/ManifestEditor-current.jar tools/ManifestPatch.java
          java -cp tools/ManifestEditor-current.jar:tools ManifestPatch             vendor/EysClone-1.3.59.apk             dist/FLY8s-Light-Cloner-manifest.apk             "${{ steps.package.outputs.name }}"
          test -s dist/FLY8s-Light-Cloner-manifest.apk

      - name: Add Shizuku bridge classes
        run: |
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > dist/classes2.dex
          test -s dist/classes2.dex
          cp dist/FLY8s-Light-Cloner-manifest.apk dist/FLY8s-Light-Cloner-unsigned.apk
          zip -q -j dist/FLY8s-Light-Cloner-unsigned.apk dist/classes2.dex

      - name: Verify APK structure
        run: |
          test -s dist/FLY8s-Light-Cloner-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging             dist/FLY8s-Light-Cloner-unsigned.apk | head -n 8
          unzip -l dist/FLY8s-Light-Cloner-unsigned.apk | grep -E             'AndroidManifest.xml|resources.arsc|classes.dex|classes2.dex'

      - name: Align APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4             dist/FLY8s-Light-Cloner-unsigned.apk             dist/FLY8s-Light-Cloner-aligned.apk

      - name: Create beta signing key
        run: |
          keytool -genkeypair             -keystore beta-signing.jks             -storepass changeit             -keypass changeit             -alias fly8-beta             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=FLY8s Light Cloner,O=FLY8,C=PH"

      - name: Sign APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks beta-signing.jks             --ks-pass pass:changeit             --key-pass pass:changeit             --out dist/FLY8s-Light-Cloner.apk             dist/FLY8s-Light-Cloner-aligned.apk

      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose             dist/FLY8s-Light-Cloner.apk
          test -s dist/FLY8s-Light-Cloner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FLY8s-Light-Cloner-private-beta
          path: dist/FLY8s-Light-Cloner.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}"             dist/FLY8s-Light-Cloner.apk             --generate-notes             --title "FLY8's Light Cloner ${{ github.ref_name }}"
